<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>잠잠 — 아기 수면의식 가이드</title>
<style>
  :root {
    --bg: #101418;
    --bg-card: #181e24;
    --bg-raised: #1f262e;
    --text: #b9c0c7;
    --text-dim: #7d868f;
    --text-faint: #58616a;
    --accent: #c97b3f;   /* 주황: 강성울음 + 기본 강조 */
    --accent-dim: #8a5730;
    --accent-bg: #2a1f14;
    --danger: #c94f52;   /* 빨강: 위험신호·응급 */
    --danger-bg: #2a1315;
    --calm: #6faa77;     /* 초록: 조용함·진정됨 */
    --calm-dim: #4a7a54;
    --calm-bg: #14231a;
    --line: #262e36;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    line-height: 1.55;
    font-size: 16px;
  }
  #app {
    max-width: 430px;
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* ---- top bar ---- */
  #topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px 6px;
    display: none;
  }
  #topbar.visible { display: block; }
  .timers { display: flex; gap: 6px; }
  .timerbox {
    flex: 1; background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px 6px; text-align: center;
  }
  .timerbox .tlabel { font-size: 11px; color: var(--text-faint); letter-spacing: -0.2px; }
  .timerbox .tval { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--text); }
  .timerbox.warn { border-color: var(--danger); background: var(--danger-bg); }
  .timerbox.warn .tval, .timerbox.warn .tlabel { color: var(--danger); }
  .timerbox.warn-hard { border-color: var(--accent); background: var(--accent-bg); }
  .timerbox.warn-hard .tval, .timerbox.warn-hard .tlabel { color: var(--accent); }
  #nonstopWarn {
    display: none; margin-top: 6px; padding: 7px 10px;
    background: var(--danger-bg); border: 1px solid var(--danger);
    border-radius: 8px; font-size: 12.5px; color: var(--danger);
  }
  #nonstopWarn.visible { display: block; }
  #wakelockBtn {
    flex: 1;
    background: none; border: 1px dashed var(--line); border-radius: 8px;
    color: var(--text-faint); font-family: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer;
    display: none;
  }
  #wakelockBtn.supported { display: block; }
  #wakelockBtn.on { border-color: var(--accent-dim); color: var(--accent); border-style: solid; }
  .topbar-head { display: flex; gap: 6px; margin-bottom: 6px; }
  #btnRestart {
    flex: 1;
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--text-faint); font-family: inherit; font-size: 12px;
    padding: 5px 10px; cursor: pointer;
  }
  /* ---- screen ---- */
  #screen { flex: 1; padding: 18px 18px 130px; }
  .stage-label { font-size: 12.5px; color: var(--accent); letter-spacing: 0.5px; margin-bottom: 6px; }
  h1 { font-size: 24px; font-weight: 700; color: #d7dce1; margin-bottom: 12px; letter-spacing: -0.3px; }
  .guide { font-size: 16.5px; color: var(--text); margin-bottom: 18px; }
  .guide strong { color: #d7dce1; }
  .bigtimer {
    text-align: center; margin: 22px 0;
    font-size: 46px; font-variant-numeric: tabular-nums;
    color: #d7dce1; font-weight: 300;
  }
  .bigtimer .sub { display: block; font-size: 13px; color: var(--text-faint); font-weight: 400; margin-top: 2px; }
  .btn {
    display: block; width: 100%; min-height: 60px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg-raised); color: var(--text);
    font-size: 17px; font-family: inherit; font-weight: 600;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
    text-align: center; letter-spacing: -0.2px;
  }
  .btn:active { filter: brightness(1.25); }
  .btn .btn-sub { display: block; font-size: 12.5px; font-weight: 400; color: var(--text-dim); margin-top: 2px; }
  .btn-primary { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent); }
  .btn-primary .btn-sub { color: var(--accent-dim); }
  .btn-danger { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .btn-calm { background: var(--calm-bg); border-color: var(--calm-dim); color: var(--calm); }
  .btn-calm .btn-sub { color: var(--calm-dim); }
  .btn-hard { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .btn-hard .btn-sub { color: var(--accent-dim); }
  .btn-cry { min-height: 48px; font-size: 14.5px; font-weight: 400; background: none; border: 1px dashed var(--accent-dim); color: var(--accent); }
  .btn-quiet { min-height: 48px; font-size: 14.5px; font-weight: 400; color: var(--text-dim); background: none; }
  .btn-pulse { animation: pulse 1.6s ease-in-out infinite; border-color: var(--accent); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(201,123,63,0); } 50% { box-shadow: 0 0 0 4px rgba(201,123,63,0.18); } }
  .note {
    background: var(--bg-card); border: 1px solid var(--line); border-left: 3px solid var(--accent-dim);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--text-dim); margin-bottom: 16px;
  }
  .note.danger { border-left-color: var(--danger); color: var(--danger); }
  .checklist { list-style: none; margin-bottom: 14px; }
  .checklist > li {
    background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .checklist .group-name { font-size: 12px; color: var(--accent); margin-bottom: 4px; }
  .checklist .item-label { font-size: 15.5px; color: var(--text); }
  .checklist .item-check { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
  .item-btn {
    min-height: 44px; width: 100%; border-radius: 8px; border: 1px solid var(--danger);
    background: var(--danger-bg); color: var(--danger); font-size: 14.5px; font-weight: 600;
    font-family: inherit; padding: 8px 10px; margin-top: 6px; cursor: pointer; text-align: left;
  }
  .item-btn.cause { border-color: var(--accent-dim); background: var(--accent-bg); color: var(--accent); }
  .item-live {
    margin: 6px 0 2px; padding: 6px 9px; border-radius: 6px;
    background: var(--bg-raised); border: 1px solid var(--accent-dim);
    font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .checklist details { margin-top: 4px; }
  .checklist summary {
    cursor: pointer; font-size: 14.5px; font-weight: 600; color: var(--accent);
    padding: 10px 0 4px; list-style-position: inside;
  }
  .stepdots { display: flex; gap: 5px; margin-bottom: 14px; }
  .stepdots span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .stepdots span.done { background: var(--accent-dim); }
  .stepdots span.now { background: var(--accent); }
  .stats { width: 100%; border-collapse: collapse; margin: 14px 0 20px; }
  .stats td { padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .stats td:first-child { color: var(--text-dim); }
  .stats td:last-child { text-align: right; color: #d7dce1; font-variant-numeric: tabular-nums; }
  .refs { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); }
  .refs p { font-size: 12px; color: var(--text-faint); margin-bottom: 4px; }
  .refs a { color: var(--text-faint); text-decoration: underline; text-underline-offset: 2px; }
  .disclaimer {
    font-size: 12.5px; color: var(--danger); margin-top: 14px;
    background: var(--danger-bg); border: 1px solid var(--danger);
    border-radius: 8px; padding: 9px 12px;
  }
  .brand { text-align: center; margin: 34px 0 6px; }
  .brand .name { font-size: 40px; font-weight: 800; color: #d7dce1; letter-spacing: 2px; }
  .brand .by { font-size: 20px; font-weight: 600; color: var(--text-dim); letter-spacing: 0; margin-left: 8px; }
  .brand .desc { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
  .biblio { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); }
  .biblio .biblio-title { font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
  .biblio ul { list-style: none; }
  .biblio li { font-size: 12px; color: var(--text-faint); margin-bottom: 4px; }
  .biblio a { color: var(--text-faint); text-decoration: underline; text-underline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chips .btn { flex: 1 1 40%; margin-bottom: 0; min-height: 56px; }
  /* ---- bottom bar ---- */
  #bottombar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; z-index: 20;
    background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: none; gap: 8px;
  }
  #bottombar.visible { display: flex; }
  #bottombar button {
    flex: 1; min-height: 56px; border-radius: 12px; font-family: inherit;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #btnRedflag { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); }
  #btnLimit { background: var(--bg-raised); border: 1px solid var(--line); color: var(--text-dim); }
  /* ---- overlay ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: rgba(6, 8, 10, 0.88);
    overflow-y: auto;
  }
  #overlay.visible { display: block; }
  #overlay .panel {
    max-width: 430px; margin: 0 auto; min-height: 100dvh;
    background: var(--bg); padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="topbar-head">
      <button id="btnRestart" type="button">⟲ 처음부터</button>
      <button id="wakelockBtn" type="button">화면 켜두기: 꺼짐</button>
    </div>
    <div class="timers">
      <div class="timerbox" id="tbFeed"><div class="tlabel">마지막 수유 후</div><div class="tval" id="tvFeed">—</div></div>
      <div class="timerbox" id="tbHard"><div class="tlabel">누적 강성울음</div><div class="tval" id="tvHard">0:00</div></div>
      <div class="timerbox" id="tbNonstop"><div class="tlabel">연속 울음</div><div class="tval" id="tvNonstop">—</div></div>
    </div>
    <div id="nonstopWarn">연속 울음 90분 경과 — 2시간 병원 기준에 접근하고 있습니다. 그치지 않는 울음이 2시간을 넘으면 진료가 필요합니다.</div>
  </div>
  <div id="screen"></div>
  <div id="bottombar">
    <button id="btnRedflag" type="button">위험신호 확인</button>
    <button id="btnLimit" type="button">부모 한계</button>
  </div>
  <div id="overlay"><div class="panel" id="overlayPanel"></div></div>
</div>

<script>
'use strict';

/* =========================================================
 * 잠잠 (JamJam) — 아기 수면의식 가이드 MVP
 * 스펙: 세컨드 브레인 baby-sleep-state-machine v1 (2026-07-17)
 * 단일 파일 · 프레임워크 없음 · 런타임 네트워크 요청 0회
 * ========================================================= */

/* ---------- 타이밍 파라미터 (스펙 표 1:1) ---------- */
const MIN = 60 * 1000;
const T = {
  UPRIGHT_BURP: 10 * MIN,        // 수유 후 세워 안기 — AAP·KidsHealth '10~15분'의 하단
  UPRIGHT_BURP_SPITTY: 20 * MIN, // 게워냄이 잦은 아기 — AAP '최소 20분' (역류 전용 자료 중심값은 30분)
  SLEEP_ASK: 10 * MIN,           // 조용 상태 무액션 10분마다 잠듦 확인 질문 (2026-07-17 사용자 결정 — 자동 확정 폐지)
  FUSSING_LIMIT: 10 * MIN,       // 칭얼거림 관찰 한도 — 대한소아청소년과학회 '10~20분 정상 범위'의 하한을 보수적으로 채택
  BURP_RETRY: 5 * MIN,           // 트림 재시도
  BURP_GATE: 30 * MIN,           // 트림 재시도 게이트: 마지막 수유 후 30분 이내만 (가스 가능성)
  REFEED_BURP: 5 * MIN,          // 추가 수유 후 짧은 트림 — 앱 절충값 (트림 시도 1~2분(NHS) + 짧은 안정. 기관별 밤중 전용 수치는 없음)
  REFEED_GATE: 90 * MIN,         // 90분 경과 시 '배고픔 가능성 높음' 힌트 (게이트 아님 — 신호가 있으면 언제든 수유)
  LADDER_STEP: 1 * MIN,          // 진정계단 다음 칸 힌트 — 1~2분 관찰 (기관 권고 '기법당 수 분'의 하한, 격한 울음 시 즉시 격상)
  HARD_CRY_LIMIT: 30 * MIN,      // 부모 교대 기준: 누적 강성울음 30분
  NONSTOP_WARN: 90 * MIN,        // 연속 울음 90분 경고
  NONSTOP_EMERGENCY: 120 * MIN,  // 병원 기준: 연속 울음 2시간 (Seattle Children's)
  NONSTOP_GRACE: 5 * MIN,        // 연속 울음 소강 유예: 5분 미만의 잠잠은 같은 에피소드로 본다
};

/* ---------- 근거 출처 (매핑 외 URL 금지 · 책은 텍스트만) ---------- */
const REFS = {
  ttokgeRoutine:  { text: '책: 똑게육아 — 일정한 수면의식 루틴' },
  ttokgeDrowsy:   { text: '책: 똑게육아 — 졸리지만 깨어 있는 상태로 눕히기' },
  ttokgeLadder:   { text: '책: 똑게육아 p.262 — 진정계단' },
  kpsSleep:       { org: '대한소아청소년과학회 "우리 아이 올바른 수면교육"', summary: '눕힌 뒤 10~20분 칭얼거림은 정상 — 먼저 스스로 잠들 수 있는지 지켜보기', url: 'https://www.pediatrics.or.kr/bbs/index.html?code=infantcare&category=A&gubun=E&page=1&number=8808&mode=view' },
  nhsFever:       { org: 'NHS(영국 국민보건서비스) "High temperature (fever) in children"', summary: '등·가슴이 평소보다 뜨겁게 느껴지거나 아파 보일 때 체온 측정', url: 'https://www.nhs.uk/symptoms/fever-in-children/' },
  seattleNewborn: { org: 'Seattle Children\'s(미국 시애틀 아동병원) "Newborn Illness - How to Recognize"', summary: '직장 36.0°C 미만이 보온에도 오르지 않으면 즉시 진료', url: 'https://www.seattlechildrens.org/conditions/a-z/newborn-illness---how-to-recognize/' },
  niceConcern:    { org: 'NICE(영국 국립보건임상연구원) NG254 "Suspected sepsis"', summary: '"아이가 평소와 다르다"는 보호자 우려를 공식 위험 항목으로 명시', url: 'https://www.nice.org.uk/guidance/ng254/chapter/Evaluating-risk-level' },
  aapHernia:      { org: 'AAP(미국소아과학회) HealthyChildren "Inguinal Hernia"', summary: '사타구니·음낭이 부어 있으면 감돈 위험 — 즉시 진료', url: 'https://www.healthychildren.org/English/health-issues/conditions/abdominal/Pages/Inguinal-Hernia.aspx' },
  tresillian:     { org: 'Tresillian(호주 NSW 정부 지원 조기양육기관) "Responsive Settling"', summary: '눕힌 채 달래기 → 안아서 진정 → 다시 눕히기의 단계적 반응 달래기', url: 'https://www.tresillian.org.au/baby/sleep/self-settling-techniques/' },
  rcnSettling:    { org: 'Raising Children Network(호주 정부 지원 육아정보) "Patting & settling 0-6 months"', summary: '말·쉬 소리 → 토닥임 → 안아 진정 후 다시 눕히기 반복', url: 'https://raisingchildren.net.au/newborns/sleep/settling-routines/patting-settling' },
  aapSelfSoothe:  { org: 'AAP(미국소아과학회) HealthyChildren "Self-Soothing"', summary: '한 번에 감각 자극 1~2개 — 한 전략을 충분히 지속한 뒤 다음으로', url: 'https://www.healthychildren.org/English/ages-stages/baby/crying-colic/Pages/Self-Soothing-Helping-Your-Baby-Learn-This-Life-Skill.aspx' },
  unicefFeeding:  { org: 'UNICEF UK Baby Friendly(유니세프 영국) "Responsive Feeding"', summary: '수유는 영양뿐 아니라 위안·안심을 위한 것 — 달래기 수유는 정당한 반응', url: 'https://www.unicef.org.uk/babyfriendly/wp-content/uploads/sites/2/2017/12/Responsive-Feeding-Infosheet-Unicef-UK-Baby-Friendly-Initiative.pdf' },
  kidsHealthNbSleep: { org: 'KidsHealth(미국 어린이 건강정보 사이트) "Sleep and Your Newborn"', summary: '신생아기는 안아 달래서 재워도 됨 — 버릇 걱정 불필요', url: 'https://kidshealth.org/en/parents/sleepnewborn.html' },
  aapBathing:     { org: 'AAP(미국소아과학회) HealthyChildren "Bathing Your Baby"', summary: '첫 1년은 주 3회 목욕이면 충분 — 잦은 목욕은 피부 건조 유발', url: 'https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Bathing-Your-Newborn.aspx' },
  nhsWashing:     { org: 'NHS(영국 국민보건서비스) "Washing and bathing your baby"', summary: '매일 목욕 불필요 — 얼굴·목·손·엉덩이 닦기(topping and tailing)로 대체', url: 'https://www.nhs.uk/conditions/baby/caring-for-a-newborn/washing-and-bathing-your-baby/' },
  nhsReflux:      { org: 'NHS(영국 국민보건서비스) "Reflux in babies"', summary: '역류가 잦으면 수유 중·수유 후 가능한 한 오래 세워 안기', url: 'https://www.nhs.uk/conditions/reflux-in-babies/' },
  kidsHealthBurp: { org: 'KidsHealth(미국 어린이 건강정보 사이트) "Burping Your Baby"', summary: '수유 후 10~15분 세워 안기 — 게움이 잦으면 더 길게', url: 'https://kidshealth.org/en/parents/burping.html' },

  aapSpitUp:      { org: 'AAP(미국소아과학회) HealthyChildren "Why Babies Spit Up"', summary: '게움이 잦으면 수유 후 최소 20분 세워 안기', url: 'https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Why-Babies-Spit-Up.aspx' },

/* 준비·처치 단계에서도 강성울음을 집계한다 (2026-07-17 사용자 결정).
 * 기본은 울지 않음. [크게 울면서 ~중이에요] 버튼으로 시작, [울음 그쳤어요]로 종료. */
for (const name of ['bath', 'dress', 'move', 'feed', 'burp', 'burpretry', 'fixing']) {
  MACHINE[name].on.CRY_HARD_START = { action: 'cryHard' };
  MACHINE[name].on.CRY_STOPPED = { action: 'calm' };
}

/* choice 의사상태: BurpGate — 마지막 수유 30분 이내일 때만 트림 재시도 (2026-07-17 사용자 결정)
 * 30분이 지났으면 가스 가능성이 낮아 진정계단으로 건너뛴다.
 * 수유 시각을 모르면 가스를 배제할 수 없으므로 트림 재시도를 유지한다.
 * (배고픔은 원인 체크 1번에서 이미 확인 — 배고픔 게이트는 폐지) */
function burpRetryEligible(s, now) {
  return !s.burpRetryUsed && (!s.lastFeedEndAt || now - s.lastFeedEndAt <= T.BURP_GATE);
}
/* choice 의사상태: LimitGate — 누적 강성울음 30분 이상이면 교대 */
function resolveLimitGate(s) {
  return hardCryAccum(s, Date.now()) >= T.HARD_CRY_LIMIT ? 'handoff' : 'settling';
}
function burpDuration(s) { return s.spitty ? T.UPRIGHT_BURP_SPITTY : T.UPRIGHT_BURP; }

/* =========================================================
 * 세션 상태 (컨텍스트 변수 — 스펙 1:1)
 * ========================================================= */
const STORAGE_KEY = 'jamjam-session-v1';
let S = null; // 세션 없음 = 시작 화면

function newSession(startState, lastFeedEndAt, now) {
  return {
    state: startState,
    stateSince: now,
    startedAt: now,
    spitty: false,               // 게워냄이 잦은 아기 (트림 시간 연장)
    lastFeedEndAt: lastFeedEndAt,
    burpRetryUsed: false,
    hardCryAccumBase: 0,         // 누적 강성울음(ms) — 확정 누적분
    hardCrySince: null,          // 진행 중 강성울음 시작 시각
    nonstopCrySince: null,       // 연속 울음 시작 시각 (병원 2시간 기준) — 누적과 별개
    nonstopQuietAt: null,        // 연속 울음 중 소강 시작 시각 (5분 유예 판정용)
    cryType: null,               // null | 'fussy' | 'hard'
    ladderStep: 1,               // 재진입 시 항상 1로 리셋
    ladderPrompt: false,         // L4 완료 시점 원인 재체크 프롬프트
    ladderPromptShown: false,    // 세션당 한 번만
    quietSince: null,
    sleepAskedAt: null,          // 마지막 잠듦 확인 질문 시각 — 조용 유지 시간과 별개로 10분 주기 재질문
    hiccupNote: false,
    settledVia: null,            // settling 진입 경로 (안내 배너용)
    fixingCause: null,
    feedPausedCry: null,         // 추가 수유 중 일시정지된 울음 스냅샷 {type, nonstopSince, pausedAt}
    emergencyFlags: [],
    stats: { laidDownAt: null, asleepAt: null, crySegments: [], causesFound: [] },
    ended: false,
  };
}

function hardCryAccum(s, now) {
  return s.hardCryAccumBase + (s.hardCrySince ? now - s.hardCrySince : 0);
}

/* ---------- 울음 추적: 연속(nonstop)과 누적(hardCryAccum)은 별개 ---------- */
function setCry(s, type, now) {
  if (s.cryType === type) return;
  // 진행 중 구간 마감
  const segs = s.stats.crySegments;
  if (s.cryType && segs.length && segs[segs.length - 1].end === null) {
    segs[segs.length - 1].end = now;
  }
  if (s.cryType === 'hard' && s.hardCrySince) {
    s.hardCryAccumBase += now - s.hardCrySince;
    s.hardCrySince = null;
  }
  // 새 구간 시작
  if (type) {
    segs.push({ type: type, start: now, end: null });
    if (!s.nonstopCrySince) s.nonstopCrySince = now;
    s.nonstopQuietAt = null; // 유예 내 재개 → 연속 울음 이어서 집계
    if (type === 'hard') s.hardCrySince = now;
  } else if (s.nonstopCrySince) {
    s.nonstopQuietAt = now; // 즉시 리셋하지 않음 — 5분 이상 잠잠해야 에피소드 종료 (evalAuto에서 확정)
  }
  s.cryType = type;
}

/* ---------- 액션 ---------- */
const ACTIONS = {
  feedEnd(s, now) { s.lastFeedEndAt = now; },
  refeedEnd(s, now) { s.lastFeedEndAt = now; s.burpRetryUsed = false; s.feedPausedCry = null; }, // 새 수유 = 새 가스 가능성
  pauseCryForFeed(s, now) {
    if (s.cryType) {
      s.feedPausedCry = { type: s.cryType, nonstopSince: s.nonstopCrySince, pausedAt: now };
      setCry(s, null, now);
    } else {
      s.feedPausedCry = null;
    }
  },
  resumeCryDuringFeed(s, now) {
    const p = s.feedPausedCry;
    if (!p) return;
    setCry(s, p.type, p.pausedAt);      // 수유 시작 시점부터 소급해 이어서 집계
    s.nonstopCrySince = p.nonstopSince; // 연속 울음도 끊기지 않은 것으로 복원
    s.feedPausedCry = null;
  },
  feedEndAndCalm(s, now) { s.lastFeedEndAt = now; setCry(s, null, now); },
  l7Fail(s, now) { s.lastFeedEndAt = now; s.ladderStep = 1; s.ladderPrompt = false; }, // LimitGate → Settling: ladderStep=1
  calm(s, now) { setCry(s, null, now); s.quietSince = now; s.sleepAskedAt = null; },
  notAsleep(s, now) { s.sleepAskedAt = now; }, // 질문 주기만 리셋 — 조용 유지 시간(quietSince)은 누적 유지
  crySoft(s, now) { setCry(s, 'fussy', now); s.quietSince = null; },
  cryHard(s, now) { setCry(s, 'hard', now); s.quietSince = null; },
  hiccup(s, now) { setCry(s, null, now); s.hiccupNote = true; },
  markBurpRetry(s) { s.burpRetryUsed = true; },
  ladderReset(s) { s.ladderStep = 1; s.ladderPrompt = false; },
  ladderNext(s, now) {
    if (s.ladderStep < 7) {
      s.ladderStep += 1;
      s.stateSince = now; // 칸당 2분 타이머 재시작
      if (s.ladderStep === 5 && !s.ladderPromptShown) { // L4 완료 시점
        s.ladderPrompt = true;
        s.ladderPromptShown = true;
      }
    }
  },
  dismissLadderPrompt(s) { s.ladderPrompt = false; },
  setCauseHunger(s, now) { s.stats.causesFound.push({ label: '배고픔', at: now }); },
  setCause(s, now, payload) {
    s.fixingCause = payload;
    const c = CAUSES.find((x) => x.id === payload);
    if (c) s.stats.causesFound.push({ label: c.label, at: now });
  },
  setFlag(s, now, payload) { if (!s.emergencyFlags.includes(payload)) s.emergencyFlags.push(payload); },
  setNonstopFlag(s) { if (!s.emergencyFlags.includes(NONSTOP_FLAG.id)) s.emergencyFlags.push(NONSTOP_FLAG.id); },
  enterSettling(s, now) {
    if (!s.stats.laidDownAt) s.stats.laidDownAt = now;
    s.quietSince = null;
  },
  enterAsleep(s, now) {
    setCry(s, null, now);
    s.stats.asleepAt = s.quietSince || now; // 조용해지기 시작한 시각으로 소급 (2026-07-17 사용자 결정)
    s.hardCryAccumBase = 0; // 잠듦 확정 시 누적 강성울음 리셋 (사용자 확정)
    s.hardCrySince = null;
    s.ended = true;
  },
};

/* ---------- 전이 실행 ---------- */
function dispatch(event, payload) {
  if (!S || S.ended) return;
  const def = MACHINE[S.state];
  const tr = def.on && def.on[event];
  if (!tr) return;
  transition(tr, Date.now(), payload);
}

function transition(tr, now, payload) {
  if (tr.action) ACTIONS[tr.action](S, now, payload);
  let target = tr.target;
  if (typeof target === 'function') target = target(S);
  if (target) enterState(target, now);
  save();
  render();
}

function enterState(name, now) {
  const prev = S.state;
  S.state = name;
  S.stateSince = now;
  S.hiccupNote = false;
  S.settledVia = (name === 'settling') ? prev : null;
  const def = MACHINE[name];
  if (def.entry) ACTIONS[def.entry](S, now);
}

/* 전역 이벤트: 어느 상태에서든 접근 가능 */
function globalParentLimit() { // 부모 한계 → 안전히 눕힘 확인 후 Handoff
  const now = Date.now();
  enterState('handoff', now);
  save();
  closeOverlay();
  render();
}
function globalEmergency(flagId) { // 위험신호 오버레이에서 발견
  const now = Date.now();
  ACTIONS.setFlag(S, now, flagId);
  enterState('emergency', now);
  save();
  closeOverlay();
  render();
}

/* 자동 전이 평가 (1초 틱 + visibilitychange 에서 호출) */
function evalAuto() {
  if (!S || S.ended) return;
  const now = Date.now();
  // 소강 유예 만료: 잠잠이 5분 이상 이어지면 연속 울음 에피소드 종료로 확정
  if (!S.cryType && S.nonstopCrySince && S.nonstopQuietAt && now - S.nonstopQuietAt >= T.NONSTOP_GRACE) {
    S.nonstopCrySince = null;
    S.nonstopQuietAt = null;
    save();
  }
  const def = MACHINE[S.state];
  // 전역: 연속 울음 2시간 → 응급 (Seattle Children's) — 상태와 무관하게 발동.
  // 단, 우는 중일 때만: 소강(유예) 중에 조용한 아기 앞에서 응급 화면이 뜨지 않도록. 재개되면 즉시 발동된다.
  if (!def.final && S.cryType && S.nonstopCrySince && now - S.nonstopCrySince >= T.NONSTOP_EMERGENCY) {
    transition({ target: 'emergency', action: 'setNonstopFlag' }, now);
    return;
  }
  if (!def.auto) return;
  for (const a of def.auto) {
    if (a.cond(S, now)) {
      transition({ target: a.target, action: a.action }, now);
      return;
    }
  }
}

/* ---------- 저장 / 복구 ---------- */
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) { /* 저장 불가 환경 무시 */ }
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !MACHINE[s.state]) return null;
    return s;
  } catch (e) { return null; }
}
function clearSaved() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

function esc(t) {
  return String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtClock(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const mm = (h > 0 && m < 10 ? '0' : '') + m;
  return (h > 0 ? h + ':' + mm : m) + ':' + (ss < 10 ? '0' : '') + ss;
}
function fmtDur(ms) {
  const m = Math.round(ms / MIN);
  if (m < 60) return m + '분';
  return Math.floor(m / 60) + '시간 ' + (m % 60) + '분';
}
function refsHtml(keys) {
  let html = '<div class="refs">';
  for (const k of keys) {
    const r = REFS[k];
    if (r.text) html += '<p>근거: ' + esc(r.text) + '</p>';
    else html += '<p>근거: <a href="' + r.url + '" target="_blank" rel="noopener">' + esc(r.org) + '</a> — ' + esc(r.summary) + '</p>';
  }
  return html + '</div>';
}

}

/* ---------- 메인 렌더 ---------- */
function render() {
  if (uiMode === 'start') { renderStart(); }
  else if (uiMode === 'resume') { renderResume(loadSaved()); }
  else if (uiMode === 'feedwhen') { renderFeedWhen(); }
  else if (uiMode === 'session' && S) {
    $screen.innerHTML = SCREENS[S.state](Date.now());
  }
  const inSession = uiMode === 'session' && S && !S.ended && S.state !== 'emergency';
  $topbar.classList.toggle('visible', inSession);
  $bottombar.classList.toggle('visible', inSession);
  window.scrollTo(0, 0);
  tickDisplay();
}

/* ---------- 1초 틱: 표시 갱신 + 자동 전이 (시간 누적은 timestamp 계산으로만) ---------- */
function tickDisplay() {
  const now = Date.now();
  if (S && uiMode === 'session' && !S.ended) {
    // 상단 타이머 3종
    document.getElementById('tvFeed').textContent = S.lastFeedEndAt ? fmtDur(now - S.lastFeedEndAt) : '—';
    const accum = hardCryAccum(S, now);
    document.getElementById('tvHard').textContent = fmtClock(accum);
    document.getElementById('tbHard').classList.toggle('warn-hard', accum >= T.HARD_CRY_LIMIT);
    const nonstop = S.nonstopCrySince ? now - S.nonstopCrySince : null;
    document.getElementById('tvNonstop').textContent = nonstop !== null ? fmtClock(nonstop) : '—';
    document.getElementById('tbNonstop').classList.toggle('warn', nonstop !== null && nonstop >= T.NONSTOP_WARN);
    document.getElementById('nonstopWarn').classList.toggle('visible', nonstop !== null && nonstop >= T.NONSTOP_WARN);
    // 화면 내 타이머
    const el = $screen.querySelector('[data-timer]');
    if (el) {
      const kind = el.getAttribute('data-timer');
      if (kind === 'burp') el.textContent = fmtClock(burpDuration(S) - (now - S.stateSince));
      else if (kind === 'quiet') el.textContent = fmtClock(now - (S.quietSince || now));
      else if (kind === 'fussing') el.textContent = fmtClock(now - S.stateSince);
      else if (kind === 'burpretry') el.textContent = fmtClock(T.BURP_RETRY - (now - S.stateSince));
      else if (kind === 'refeedburp') el.textContent = fmtClock(T.REFEED_BURP - (now - S.stateSince));
      else if (kind === 'ladder') el.textContent = fmtClock(now - S.stateSince);
    }
    // 진정계단 2분 경과 시 다음 칸 버튼 강조
    if (S.state === 'ladder' && S.ladderStep < 7) {
      const nextBtn = $screen.querySelector('[data-event="NEXTSTEP"]');
      if (nextBtn) nextBtn.classList.toggle('btn-pulse', now - S.stateSince >= T.LADDER_STEP);
    }
  }
}
function tick() {
  if (uiMode === 'session') evalAuto();
  tickDisplay();
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    tick();          // 화면 잠금·백그라운드 후 즉시 재평가
    reacquireWakeLock();
  } else {
    if (S) save();
  }
});

/* ---------- 이벤트 위임 ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-event]');
  if (!el) return;
  const ev = el.getAttribute('data-event');
  const payload = el.getAttribute('data-payload');
  const now = Date.now();

  // 세션 외 UI 이벤트
  if (ev === 'START_FULL') { S = newSession('bath', null, now); uiMode = 'session'; save(); render(); return; }
  if (ev === 'START_SETTLE') { uiMode = 'feedwhen'; render(); return; }
  if (ev === 'BACK_START') { uiMode = 'start'; render(); return; }
  if (ev === 'FEEDWHEN') {
    const lastFeed = payload === 'unknown' ? null : now - parseInt(payload, 10) * MIN;
    S = newSession('settling', lastFeed, now);
    ACTIONS.enterSettling(S, now);
    uiMode = 'session'; save(); render(); return;
  }
  if (ev === 'RESUME_SESSION') { S = loadSaved(); uiMode = 'session'; render(); return; }
  if (ev === 'DISCARD_SESSION') { clearSaved(); S = null; uiMode = 'start'; render(); return; }
  if (ev === 'NEW_SESSION') { clearSaved(); S = null; uiMode = 'start'; render(); return; }
  if (ev === 'TOGGLE_SPITTY') { S.spitty = !S.spitty; save(); render(); return; }
  // 오버레이 이벤트
  if (ev === 'OVERLAY_CLOSE') { closeOverlay(); return; }
  if (ev === 'OVERLAY_FLAG') { globalEmergency(payload); return; }
  if (ev === 'OVERLAY_LIMIT_GO') { globalParentLimit(); return; }
  if (ev === 'OVERLAY_RESTART_GO') { clearSaved(); S = null; uiMode = 'start'; closeOverlay(); render(); return; }
  // 상태머신 이벤트
  dispatch(ev, payload);
});

/* ---------- 전역 오버레이: 위험신호 확인 / 부모 한계 ---------- */
function openRedflagOverlay() {
  let list = tempGroupHtml('OVERLAY_FLAG');
  for (const g of REDFLAGS) {
    if (g.custom) continue;
    list += '<li><div class="group-name">' + esc(g.group) + '</div>' +
      g.items.map((it) =>
        '<button type="button" class="item-btn" data-event="OVERLAY_FLAG" data-payload="' + it.id + '">' + esc(it.label) + '</button>'
      ).join('') + '</li>';
  }
  $overlayPanel.innerHTML = '<h1>위험신호 확인</h1>' +
    '<p class="guide">해당 항목이 있으면 누르세요. 현재 진행과 타이머는 그대로 유지됩니다.</p>' +
    '<ul class="checklist">' + list + '</ul>' +
    '<div class="note">이 목록에 없어도, "오늘은 평소와 다르다"는 직감이 강하게 들면 그 직감을 믿고 병원에 연락하세요.</div>' +
    btn('OVERLAY_CLOSE', '해당 없음 — 돌아가기', 'btn-primary') +
    refsHtml(['seattleCrying', 'seattleEmerg', 'nhsFever', 'seattleNewborn', 'niceConcern']);
  $overlay.classList.add('visible');
}
function openLimitOverlay() {
  $overlayPanel.innerHTML = '<h1>부모 한계</h1>' +
    '<p class="guide">괜찮습니다. 먼저 아기를 침대에 <strong>안전히 등을 대고</strong> 눕히세요.</p>' +
    '<div class="note danger">절대 아기를 흔들지 마세요.</div>' +
    btn('OVERLAY_LIMIT_GO', '눕혔어요 — 교대·휴식으로', 'btn-primary') +
    btn('OVERLAY_CLOSE', '취소', 'btn-quiet') +
    refsHtml(['kaiserHandoff']);
  $overlay.classList.add('visible');
}
function openRestartOverlay() { // 오터치 방지: 즉시 리셋하지 않고 반드시 확인을 거친다
  $overlayPanel.innerHTML = '<h1>처음부터 시작할까요?</h1>' +
    '<p class="guide">진행 중인 세션 기록(타이머·울음 집계·발견한 원인)이 <strong>모두 삭제</strong>됩니다.</p>' +
    btn('OVERLAY_RESTART_GO', '처음부터 시작 — 기록 삭제', 'btn-primary') +
    btn('OVERLAY_CLOSE', '취소', 'btn-quiet');
  $overlay.classList.add('visible');
}
function closeOverlay() { $overlay.classList.remove('visible'); $overlayPanel.innerHTML = ''; }
document.getElementById('btnRedflag').addEventListener('click', openRedflagOverlay);
document.getElementById('btnLimit').addEventListener('click', openLimitOverlay);
document.getElementById('btnRestart').addEventListener('click', openRestartOverlay);

/* ---------- 이탈 경고 ---------- */
window.addEventListener('beforeunload', (e) => {
  if (uiMode === 'session' && S && !S.ended) {
    save();
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ---------- Screen Wake Lock (미지원 브라우저에서는 숨김) ---------- */
let wakeLock = null;
let wakeLockWanted = false;
const $wakeBtn = document.getElementById('wakelockBtn');
if ('wakeLock' in navigator) {
  $wakeBtn.classList.add('supported');
  $wakeBtn.addEventListener('click', async () => {
    wakeLockWanted = !wakeLockWanted;
    if (wakeLockWanted) await requestWakeLock(); else await releaseWakeLock();
    updateWakeBtn();
  });
}
async function requestWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; updateWakeBtn(); });
  } catch (e) { wakeLock = null; wakeLockWanted = false; }
}
async function releaseWakeLock() {
  if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; }
}
function reacquireWakeLock() {
  if (wakeLockWanted && !wakeLock) requestWakeLock().then(updateWakeBtn);
}
function updateWakeBtn() {
  $wakeBtn.textContent = '화면 켜두기: ' + (wakeLock ? '켜짐' : '꺼짐');
  $wakeBtn.classList.toggle('on', !!wakeLock);
}

/* ---------- 초기화: 진행 중 세션 복구 ---------- */
(function init() {
  const saved = loadSaved();
  if (saved && !saved.ended) uiMode = 'resume';
  else uiMode = 'start';
  render();
})();
</script>
