name: Deploy to Cloudflare Workers

# 보안: 공개 레포이므로 포크 PR에 시크릿이 노출되지 않도록
# pull_request 트리거는 두지 않는다. main 푸시와 수동 실행에서만 배포한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시 배포 방지: 같은 브랜치의 이전 실행이 진행 중이면 취소
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN 권한 최소화 (코드 체크아웃만 필요)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy (wrangler deploy)
        uses: cloudflare/wrangler-action@v3
        with:
          # 실제 값은 레포에 없음 — GitHub Secrets에서 주입됨
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
